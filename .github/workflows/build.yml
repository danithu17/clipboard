name: Build Clipboard Manager
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup vcpkg
        run: |
          cd C:\tools\vcpkg
          git pull
          .\bootstrap-vcpkg.bat

      - name: Install dependencies
        run: vcpkg install imgui glfw3 glew --triplet x64-windows

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=C:/tools/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: Clipboard-Tool
          path: build/Release/*.exe